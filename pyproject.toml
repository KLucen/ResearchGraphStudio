[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "researchgraph-engine"
version = "0.0.1"
description = "Local engine for ResearchGraph Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3",
  "SQLAlchemy>=2,<3", "alembic>=1.13,<2", "filelock>=4,<5",
  "PyMuPDF==1.26.7",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1", "mypy>=2,<3", "pyinstaller>=6,<7", "pip-tools>=7,<8"]

[tool.setuptools.packages.find]
where = ["services/engine"]

[tool.setuptools.package-data]
researchgraph = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests/engine"]
pythonpath = ["services/engine"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/engine/researchgraph"]

[[tool.mypy.overrides]]
module = ["uvicorn.*", "pymupdf.*"]
ignore_missing_imports = true
